name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Blazearth
          outputs: |
            dist/github-snake.svg?color_snake=%2377746D&color_dots=%23F0EFEA,%23D4D1C9,%239E9B93,%2355524B,%23252422
            dist/github-snake-dark.svg?color_snake=%23D7D4CC&color_dots=%23090909,%23181818,%23333333,%23666666,%23A8A6A0

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
